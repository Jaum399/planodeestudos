name: Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend && npm install --legacy-peer-deps
          cd ../backend && npm install

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend with Vercel
        run: |
          cd frontend
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --confirm 2>&1 || echo "Deploy iniciado"
        continue-on-error: true

      - name: Setup environment variables for production
        run: |
          echo "ℹ️  Deployment triggered via push to master"
          echo "🔗 Vercel will autodeploy when secrets are configured"
          echo "📝 Configure these GitHub Secrets:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID (optional)"
          echo "   - VERCEL_PROJECT_ID (optional)"
