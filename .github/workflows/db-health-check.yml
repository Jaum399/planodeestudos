name: Daily DB Health Check

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  db-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run DB health check
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: node scripts/db-health-check.js

      - name: Notify Slack on failure
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(cat <<'JSON'
          {
            "text": "[appmentoria] Falha no Daily DB Health Check. Verifique o run no GitHub Actions."
          }
          JSON
          )
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"

      - name: Notify Email on failure
        if: ${{ failure() && secrets.SMTP_HOST != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USER != '' && secrets.SMTP_PASS != '' && secrets.ALERT_EMAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Appmentoria Monitor <${{ secrets.SMTP_USER }}>
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: '[appmentoria] Falha no Daily DB Health Check'
          body: |
            O health-check diario do banco falhou.
            Repositorio: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
