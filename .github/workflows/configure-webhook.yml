name: 🔗 Auto Configure Webhook on Deploy

on:
  deployment:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - sandbox

jobs:
  configure-webhook:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔗 Configure Webhook
        run: |
          echo "🚀 Configurando webhook automaticamente..."
          echo ""

          # Export variáveis de ambiente
          export ASAAS_API_KEY="${{ secrets.ASAAS_API_KEY }}"
          export ASAAS_ENV="production"

          # Executar script
          node configure-webhook.js
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_ENV: production

      - name: 📝 Create Deployment Summary
        if: always()
        run: |
          echo "## 🔗 Webhook Configuration Summary" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Webhook configuration attempt completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Events Configured:**" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_RECEIVED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_CONFIRMED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_CREATED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_AWAITING_RISK_ANALYSIS" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_OVERDUE" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_DELETED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_REFUNDED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_REFUND_IN_PROGRESS" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_CHARGEBACK_REQUESTED" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_CHARGEBACK_DISPUTE" >> $GITHUB_STEP_SUMMARY
          echo "- PAYMENT_REPROVED_BY_RISK_ANALYSIS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Webhook URL:**" >> $GITHUB_STEP_SUMMARY
          echo "- https://app-planodeestudos.vercel.app/api/payment/webhook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Check Asaas Dashboard: https://www.asaas.com" >> $GITHUB_STEP_SUMMARY
          echo "2. Navigate to: Webhooks section" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify webhook is listed and active" >> $GITHUB_STEP_SUMMARY
          echo "4. Monitor logs: \`vercel logs --tail\`" >> $GITHUB_STEP_SUMMARY
